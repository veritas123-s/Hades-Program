name: Medstack Android package smoke
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android release build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: Medstack-5.0.0-Android-unsigned
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: test-input
      - name: Sign a disposable emulator test copy
        run: |
          keytool -genkeypair -alias synthetic -keyalg RSA -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android -dname 'CN=Medstack emulator synthetic test' -validity 2
          java -jar test-input/apksigner.jar sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias synthetic --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/test.apk" test-input/outputs/apk/release/app-release-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-package-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Medstack-Android-launch-evidence
          path: test-results/android-smoke/
          retention-days: 14
